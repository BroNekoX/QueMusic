name: Build Linux AppImage

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要创建的 Release tag（如 v0.2.0）。不能与已有 tag 重复。'
        required: true
        default: ''
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ========== 安装系统依赖（包括编译 fcitx5-qt6 所需包） ==========
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxcb-icccm4-dev libxcb-keysyms1-dev \
            libxcb-image0-dev libxcb-shm0-dev libxcb-util-dev \
            libxcb-cursor0 libxcb-cursor-dev libxcb-randr0-dev \
            libxcb-shape0-dev libxcb-xinerama0-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libgl1-mesa-dev libfuse2 ninja-build wget file \
            libpulse-dev libpulse0 \
            extra-cmake-modules gettext \
            libfcitx5-qt-dev fcitx5-dev \
            cmake
          ls -la /usr/lib/x86_64-linux-gnu/libpulse*

      # ========== 安装 Qt 6.10.3 并包含 qtwayland 模块 ==========
      - name: Install Qt 6.10.3 (aqtinstall)
        run: |
          python3 -m pip install --break-system-packages aqtinstall
          python3 -m aqt install-qt linux desktop 6.10.3 linux_gcc_64 \
            -O "$HOME/Qt" \
            -m qtmultimedia qtshadertools qt5compat qtwayland
          echo "$HOME/Qt/6.10.3/gcc_64/bin" >> "$GITHUB_PATH"

      # ========== 编译并安装 fcitx5-qt6（链接到我们的 Qt 6.10.3） ==========
      - name: Build and install fcitx5-qt6
        run: |
          git clone --depth 1 https://github.com/fcitx/fcitx5-qt.git
          cd fcitx5-qt
          mkdir build && cd build
          cmake .. \
            -DQt6_DIR="$HOME/Qt/6.10.3/gcc_64/lib/cmake/Qt6" \
            -DCMAKE_INSTALL_PREFIX="$HOME/Qt/6.10.3/gcc_64" \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_QT5=OFF \
            -DENABLE_QT6=ON
          make -j"$(nproc)"
          make install
          # 验证插件是否生成
          ls -l "$HOME/Qt/6.10.3/gcc_64/plugins/platforminputcontexts/"

      - name: Configure (CMake)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOME/Qt/6.10.3/gcc_64"

      - name: Build
        run: |
          cmake --build build -j"$(nproc)"

      - name: Download linuxdeploy tools
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      # ========== 准备 AppDir，复制 .desktop 和图标 ==========
      - name: Prepare AppDir (base)
        run: |
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp packaging/QueMusic.desktop AppDir/usr/share/applications/
          cp resources/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/quemusic.png

      # ========== 生成自定义 AppRun 脚本（支持 Wayland 和 fcitx5） ==========
      - name: Create custom AppRun script
        run: |
          cat > AppRun.sh << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin/:${HERE}/bin/:${PATH:+:$PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib/:${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export QT_PLUGIN_PATH="${HERE}/usr/plugins"
          # 让 Qt 自动选择平台（Wayland 优先），并启用 fcitx5
          export QT_IM_MODULE=fcitx
          # 不强制指定 QT_QPA_PLATFORM，让 Qt 自动探测
          exec "${HERE}/usr/bin/QueMusic" "$@"
          EOF
          chmod +x AppRun.sh

      # ========== 打包 AppImage（使用我们的 Qt 和 qmake） ==========
      - name: Package AppImage
        run: |
          export QMAKE="$HOME/Qt/6.10.3/gcc_64/bin/qmake"
          export QT_QMAKE_EXECUTABLE="$QMAKE"
          export LD_LIBRARY_PATH="$HOME/Qt/6.10.3/gcc_64/lib:$LD_LIBRARY_PATH"
          export QML_SOURCES_PATHS="$(pwd)"
          export EXTRA_QT_MODULES="multimedia;sql;shadertools;wayland"
          export QT_QPA_PLATFORM=minimal

          # 删除可能存在的冲突库（确保完全使用我们的 Qt）
          rm -f AppDir/usr/lib/libQt6Core.so.* 2>/dev/null || true

          # 使用 linuxdeploy 打包，并显式传递 qmake 路径给 qt 插件
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            --executable build/bin/QueMusic \
            --desktop-file AppDir/usr/share/applications/QueMusic.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/quemusic.png \
            --plugin qt -qmake="$QMAKE" \
            --custom-apprun AppRun.sh \
            --output appimage

          # 重命名生成的 AppImage
          mv QueMusic-*.AppImage QueMusic-x86_64.AppImage 2>/dev/null || true
          ls -la QueMusic-*.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: QueMusic-x86_64.AppImage
          path: QueMusic-x86_64.AppImage

      # ========== Release 相关步骤 ==========
      - name: Check if release tag already exists (manual trigger only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if gh release view "$TAG" &>/dev/null; then
            echo "❌ Error: Release tag '$TAG' already exists. Please choose a different tag."
            exit 1
          fi
          echo "✅ Tag '$TAG' is available."

      - name: Create Release and upload AppImage
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.release_tag }}
          files: QueMusic-x86_64.AppImage
          generate_release_notes: false