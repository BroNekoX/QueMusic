name: Build Linux AppImage

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要创建的 Release tag（如 v0.2.0）。不能与已有 tag 重复。'
        required: true
        default: ''
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
        contents: write
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ========== 安装系统依赖（新增 fcitx5 和 wayland 相关包） ==========
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxcb-icccm4-dev libxcb-keysyms1-dev \
            libxcb-image0-dev libxcb-shm0-dev libxcb-util-dev \
            libxcb-cursor0 libxcb-cursor-dev libxcb-randr0-dev \
            libxcb-shape0-dev libxcb-xinerama0-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libgl1-mesa-dev libfuse2 ninja-build wget file \
            libpulse-dev libpulse0 \
            qt6-wayland fcitx5-frontend-qt6          # <--- 新增：Wayland 插件 + fcitx5 Qt6 前端
          ls -la /usr/lib/x86_64-linux-gnu/libpulse*

      - name: Install Qt 6.9.3 (aqtinstall)
        run: |
          python3 -m pip install --break-system-packages aqtinstall
          python3 -m aqt install-qt linux desktop 6.9.3 linux_gcc_64 \
            -O "$HOME/Qt" \
            -m qtmultimedia qtshadertools qt5compat
          echo "$HOME/Qt/6.9.3/gcc_64/bin" >> "$GITHUB_PATH"

      - name: Configure (CMake)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOME/Qt/6.9.3/gcc_64"

      - name: Build
        run: |
          cmake --build build -j"$(nproc)"

      - name: Download linuxdeploy tools
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      # ========== 新增：准备 AppDir 并注入 Wayland / fcitx5 插件及依赖库 ==========
      - name: Prepare AppDir with extra plugins and libraries
        run: |
          # 创建基础目录
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p AppDir/usr/plugins/platforms
          mkdir -p AppDir/usr/plugins/platforminputcontexts
          mkdir -p AppDir/usr/lib

          # 复制 .desktop 和图标（linuxdeploy 需要）
          cp packaging/QueMusic.desktop AppDir/usr/share/applications/
          cp resources/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/quemusic.png

          # 1. 复制 Wayland 平台插件
          cp /usr/lib/x86_64-linux-gnu/qt6/plugins/platforms/libqwayland-generic.so \
             AppDir/usr/plugins/platforms/

          # 2. 复制 fcitx5 输入法插件
          cp /usr/lib/x86_64-linux-gnu/qt6/plugins/platforminputcontexts/libfcitx5platforminputcontextplugin-qt6.so \
             AppDir/usr/plugins/platforminputcontexts/

          # 3. 复制这些插件所依赖的系统库（使用 ldd 自动提取）
          for plugin in AppDir/usr/plugins/platforms/libqwayland-generic.so \
                         AppDir/usr/plugins/platforminputcontexts/libfcitx5platforminputcontextplugin-qt6.so; do
            ldd "$plugin" | grep "=> /" | awk '{print $3}' | xargs -I {} cp -n {} AppDir/usr/lib/ || true
          done

          # 4. 额外补全一些可能通过 dlopen 加载的库（防止漏掉）
          cp -n /usr/lib/x86_64-linux-gnu/libxcb*.so*    AppDir/usr/lib/ 2>/dev/null || true
          cp -n /usr/lib/x86_64-linux-gnu/libxkbcommon*.so* AppDir/usr/lib/ 2>/dev/null || true
          cp -n /usr/lib/x86_64-linux-gnu/libwayland*.so* AppDir/usr/lib/ 2>/dev/null || true
          cp -n /usr/lib/x86_64-linux-gnu/libfcitx5*.so* AppDir/usr/lib/ 2>/dev/null || true
          cp -n /usr/lib/x86_64-linux-gnu/libQt6WaylandClient.so* AppDir/usr/lib/ 2>/dev/null || true

      # ========== 新增：生成自定义 AppRun 脚本（智能选择平台 + 输入法） ==========
      - name: Create custom AppRun script
        run: |
          cat > AppRun.sh << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin/:${HERE}/bin/:${PATH:+:$PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib/:${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          # 让 Qt 从 AppDir 内部加载插件（关键）
          export QT_PLUGIN_PATH="${HERE}/usr/plugins"
          # 强制使用 fcitx5 输入法模块
          export QT_IM_MODULE=fcitx
          # 不设置 QT_QPA_PLATFORM，让 Qt 自动探测（优先使用 Wayland，避免缩放闪退）
          # 如果 Wayland 下输入法仍有问题，可取消下面一行的注释强制使用 X11：
          # export QT_QPA_PLATFORM=xcb
          exec "${HERE}/usr/bin/QueMusic" "$@"
          EOF
          chmod +x AppRun.sh

      # ========== 修改：Package AppImage（添加 --apprun-script，移除重复的 mkdir/cp） ==========
      - name: Package AppImage
        run: |
          export QMAKE="$HOME/Qt/6.9.3/gcc_64/bin/qmake"
          export QML_SOURCES_PATHS="$(pwd)"
          export EXTRA_QT_MODULES="multimedia;sql;shadertools"
          export QT_QPA_PLATFORM=minimal
          rm -f "$HOME/Qt/6.9.3/gcc_64/plugins/sqldrivers/libqsqlmimer.so"
          # linuxdeploy 会保留我们已复制到 AppDir 中的文件，并自动部署其他 Qt 库
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            --executable build/bin/QueMusic \
            --desktop-file AppDir/usr/share/applications/QueMusic.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/quemusic.png \
            --plugin qt \
            --apprun-script AppRun.sh \
            --output appimage
          mv QueMusic-*.AppImage QueMusic-x86_64.AppImage 2>/dev/null || true
          ls -la QueMusic-*.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: QueMusic-x86_64.AppImage
          path: QueMusic-x86_64.AppImage

      # ========== 以下 Release 相关步骤保持不变 ==========
      - name: Check if release tag already exists (manual trigger only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if gh release view "$TAG" &>/dev/null; then
            echo "❌ Error: Release tag '$TAG' already exists. Please choose a different tag."
            exit 1
          fi
          echo "✅ Tag '$TAG' is available."

      - name: Create Release and upload AppImage
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.release_tag }}
          files: QueMusic-x86_64.AppImage
          generate_release_notes: false