name: Build Linux AppImage

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要创建的 Release tag（如 v0.2.0）。不能与已有 tag 重复。'
        required: true
        default: ''
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
        contents: write   # 仅这个 job 获得创建 Release 的权限
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxcb-icccm4-dev libxcb-keysyms1-dev \
            libxcb-image0-dev libxcb-shm0-dev libxcb-util-dev \
            libxcb-cursor0 libxcb-cursor-dev libxcb-randr0-dev \
            libxcb-shape0-dev libxcb-xinerama0-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libgl1-mesa-dev libfuse2 ninja-build wget file \
            libpulse-dev libpulse0
          ls -la /usr/lib/x86_64-linux-gnu/libpulse*

      - name: Install Qt 6.9.3 (aqtinstall)
        run: |
          python3 -m pip install --break-system-packages aqtinstall
          python3 -m aqt install-qt linux desktop 6.9.3 linux_gcc_64 \
            -O "$HOME/Qt" \
            -m qtmultimedia qtshadertools qt5compat
          echo "$HOME/Qt/6.9.3/gcc_64/bin" >> "$GITHUB_PATH"

      - name: Configure (CMake)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOME/Qt/6.9.3/gcc_64"

      - name: Build
        run: |
          cmake --build build -j"$(nproc)"

      - name: Download linuxdeploy tools
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      - name: Package AppImage
        run: |
          export QMAKE="$HOME/Qt/6.9.3/gcc_64/bin/qmake"
          export QML_SOURCES_PATHS="$(pwd)"
          export EXTRA_QT_MODULES="multimedia;sql;shadertools"
          export QT_QPA_PLATFORM=minimal
          rm -f "$HOME/Qt/6.9.3/gcc_64/plugins/sqldrivers/libqsqlmimer.so"
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          cp packaging/QueMusic.desktop AppDir/usr/share/applications/
          cp resources/icon.png \
            AppDir/usr/share/icons/hicolor/256x256/apps/quemusic.png
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            --executable build/bin/QueMusic \
            --desktop-file AppDir/usr/share/applications/QueMusic.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/quemusic.png \
            --plugin qt \
            --output appimage
          mv QueMusic-*.AppImage QueMusic-x86_64.AppImage 2>/dev/null || true
          ls -la QueMusic-*.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: QueMusic-x86_64.AppImage
          path: QueMusic-x86_64.AppImage

      # ========== 新增：检查手动输入的 tag 是否已存在 ==========
      - name: Check if release tag already exists (manual trigger only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if gh release view "$TAG" &>/dev/null; then
            echo "❌ Error: Release tag '$TAG' already exists. Please choose a different tag."
            exit 1
          fi
          echo "✅ Tag '$TAG' is available."

      # ========== 创建 Release 并上传 AppImage ==========
      - name: Create Release and upload AppImage
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.release_tag }}
          files: QueMusic-x86_64.AppImage
          # 不设置 body 和 name，Release 标题默认取 tag 名，正文为空
          generate_release_notes: false