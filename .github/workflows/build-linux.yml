name: Build Linux AppImage

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要创建的 Release tag（如 v0.2.0）。不能与已有 tag 重复。'
        required: true
        default: ''
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ========== 安装系统依赖（包含 fcitx5 前端包） ==========
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb1-dev libxcb-icccm4-dev libxcb-keysyms1-dev \
            libxcb-image0-dev libxcb-shm0-dev libxcb-util-dev \
            libxcb-cursor0 libxcb-cursor-dev libxcb-randr0-dev \
            libxcb-shape0-dev libxcb-xinerama0-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libgl1-mesa-dev libfuse2 ninja-build wget file \
            libpulse-dev libpulse0 \
            extra-cmake-modules gettext \
            cmake
          # 尝试安装 fcitx5-qt6（Ubuntu 24.04 可能包名不同）
          sudo apt-get install -y fcitx5-qt6 || sudo apt-get install -y fcitx5-frontend-qt6 || echo "⚠️ No fcitx5 Qt6 package found, will attempt to locate plugin elsewhere"
          ls -la /usr/lib/x86_64-linux-gnu/libpulse*

      # ========== 安装 Qt 6.10.3（包含 qtwayland 模块） ==========
      - name: Install Qt 6.10.3 (aqtinstall)
        run: |
          python3 -m pip install --break-system-packages aqtinstall
          python3 -m aqt install-qt linux desktop 6.10.3 linux_gcc_64 \
            -O "$HOME/Qt" \
            -m qtmultimedia qtshadertools qt5compat qtwayland
          echo "$HOME/Qt/6.10.3/gcc_64/bin" >> "$GITHUB_PATH"

      - name: Configure (CMake)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOME/Qt/6.10.3/gcc_64"

      - name: Build
        run: |
          cmake --build build -j"$(nproc)"

      - name: Download linuxdeploy tools
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-qt-x86_64.AppImage

      # ========== 准备 AppDir：复制 .desktop、图标、Wayland 插件、fcitx5 插件 ==========
      - name: Prepare AppDir with extra plugins and libraries
        run: |
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          mkdir -p AppDir/usr/plugins/platforms
          mkdir -p AppDir/usr/plugins/platforminputcontexts
          mkdir -p AppDir/usr/lib

          cp packaging/QueMusic.desktop AppDir/usr/share/applications/
          cp resources/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/quemusic.png

          declare -a PLUGINS=()

          # 从我们的 Qt 安装中复制 Wayland 平台插件（保证版本正确）
          QT_PLUGIN_DIR="$HOME/Qt/6.10.3/gcc_64/plugins"
          if [ -f "$QT_PLUGIN_DIR/platforms/libqwayland-generic.so" ]; then
            cp "$QT_PLUGIN_DIR/platforms/libqwayland-generic.so" \
               AppDir/usr/plugins/platforms/
            PLUGINS+=("AppDir/usr/plugins/platforms/libqwayland-generic.so")
            echo "✅ Wayland plugin copied from Qt installation."
          else
            echo "⚠️ Wayland plugin not found in Qt installation, skipping."
          fi

          # 复制 fcitx5 输入法插件（从系统路径，可能不止一个位置）
          FOUND_FCITX=""
          for path in \
            /usr/lib/x86_64-linux-gnu/qt6/plugins/platforminputcontexts/libfcitx5platforminputcontextplugin-qt6.so \
            /usr/lib/x86_64-linux-gnu/qt5/plugins/platforminputcontexts/libfcitx5platforminputcontextplugin.so \
            /usr/lib/*/qt6/plugins/platforminputcontexts/*fcitx5*.so; do
            if [ -f "$path" ]; then
              FOUND_FCITX="$path"
              break
            fi
          done
          if [ -n "$FOUND_FCITX" ]; then
            cp "$FOUND_FCITX" AppDir/usr/plugins/platforminputcontexts/
            PLUGINS+=("AppDir/usr/plugins/platforminputcontexts/$(basename "$FOUND_FCITX")")
            echo "✅ fcitx5 plugin copied from $FOUND_FCITX."
          else
            echo "⚠️ fcitx5 input context plugin not found, skipping."
          fi

          # 复制插件依赖的系统库（使用 ldd 分析已复制的插件）
          for plugin in "${PLUGINS[@]}"; do
            if [ -f "$plugin" ]; then
              ldd "$plugin" | grep "=> /" | awk '{print $3}' | xargs -I {} cp -n {} AppDir/usr/lib/ || true
            fi
          done

          # 额外补全一些可能需要的系统库（图形 / 输入基础库）
          cp -n /usr/lib/x86_64-linux-gnu/libxcb*.so*    AppDir/usr/lib/ 2>/dev/null || true
          cp -n /usr/lib/x86_64-linux-gnu/libxkbcommon*.so* AppDir/usr/lib/ 2>/dev/null || true
          cp -n /usr/lib/x86_64-linux-gnu/libwayland*.so* AppDir/usr/lib/ 2>/dev/null || true
          cp -n /usr/lib/x86_64-linux-gnu/libQt6WaylandClient.so* AppDir/usr/lib/ 2>/dev/null || true
          # fcitx5 基础库（如果插件依赖了，但 ldd 可能已经复制）
          cp -n /usr/lib/x86_64-linux-gnu/libfcitx5*.so* AppDir/usr/lib/ 2>/dev/null || true

          echo "✅ AppDir preparation completed."

      # ========== 生成自定义 AppRun 脚本 ==========
      - name: Create custom AppRun script
        run: |
          cat > AppRun.sh << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin/:${HERE}/bin/:${PATH:+:$PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib/:${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export QT_PLUGIN_PATH="${HERE}/usr/plugins"
          export QT_IM_MODULE=fcitx
          # 不强制指定平台，让 Qt 自动选择（Wayland 优先）
          exec "${HERE}/usr/bin/QueMusic" "$@"
          EOF
          chmod +x AppRun.sh

      # ========== 打包 AppImage（确保使用我们的 Qt） ==========
      - name: Package AppImage
        run: |
          export QMAKE="$HOME/Qt/6.10.3/gcc_64/bin/qmake"
          export QT_QMAKE_EXECUTABLE="$QMAKE"
          export LD_LIBRARY_PATH="$HOME/Qt/6.10.3/gcc_64/lib:$LD_LIBRARY_PATH"
          export QML_SOURCES_PATHS="$(pwd)"
          export EXTRA_QT_MODULES="multimedia;sql;shadertools;wayland"
          export QT_QPA_PLATFORM=minimal

          # 删除可能存在的旧 Qt 核心库（避免混用）
          rm -f AppDir/usr/lib/libQt6Core.so.* 2>/dev/null || true

          # 使用 linuxdeploy 打包，显式传递 qmake 路径
          ./linuxdeploy-x86_64.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            --executable build/bin/QueMusic \
            --desktop-file AppDir/usr/share/applications/QueMusic.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/256x256/apps/quemusic.png \
            --plugin qt -qmake="$QMAKE" \
            --custom-apprun AppRun.sh \
            --output appimage

          mv QueMusic-*.AppImage QueMusic-x86_64.AppImage 2>/dev/null || true
          ls -la QueMusic-*.AppImage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: QueMusic-x86_64.AppImage
          path: QueMusic-x86_64.AppImage

      # ========== Release 步骤 ==========
      - name: Check if release tag already exists (manual trigger only)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if gh release view "$TAG" &>/dev/null; then
            echo "❌ Error: Release tag '$TAG' already exists. Please choose a different tag."
            exit 1
          fi
          echo "✅ Tag '$TAG' is available."

      - name: Create Release and upload AppImage
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.event.inputs.release_tag }}
          files: QueMusic-x86_64.AppImage
          generate_release_notes: false