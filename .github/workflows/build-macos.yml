name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 使用官方的 setup-qt，自动适配当前 runner 架构，并安装所需模块
      - name: Install Qt 6.9.3
        uses: qt-actions/setup-qt@v3
        with:
          version: '6.9.3'
          host: 'mac'
          target: 'desktop'
          arch: 'clang_64'          # 自动映射到当前 runner 的架构（arm64 或 x86_64）
          modules: 'qtmultimedia qtshadertools qtsql qtdeclarative qttools'

      - name: Generate .icns app icon
        run: |
          mkdir -p icon.iconset
          sips -z 16 16     resources/app/rainbowMusicIcon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     resources/app/rainbowMusicIcon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     resources/app/rainbowMusicIcon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     resources/app/rainbowMusicIcon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   resources/app/rainbowMusicIcon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   resources/app/rainbowMusicIcon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   resources/app/rainbowMusicIcon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   resources/app/rainbowMusicIcon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   resources/app/rainbowMusicIcon.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 resources/app/rainbowMusicIcon.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o resources/app/icon.icns

      - name: Configure (CMake)
        run: |
          # setup-qt 已经设置了 Qt6_DIR 环境变量，直接用
          echo "Using Qt6_DIR = $Qt6_DIR"
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$Qt6_DIR/.." \
            -DQt6_DIR="$Qt6_DIR"

      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Bundle with macdeployqt
        run: |
          APP_PATH=$(find build -maxdepth 2 -name "*.app" -type d | head -n1)
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          # macdeployqt 路径通常与 Qt6_DIR 在同一父目录的 bin 下
          DEPLOY_TOOL="$Qt6_DIR/../bin/macdeployqt"
          if [ ! -f "$DEPLOY_TOOL" ]; then
            echo "macdeployqt not found at $DEPLOY_TOOL, trying default path"
            DEPLOY_TOOL="$(which macdeployqt)" || true
          fi
          if [ -z "$DEPLOY_TOOL" ]; then
            echo "ERROR: macdeployqt not found"
            exit 1
          fi
          "$DEPLOY_TOOL" "$APP_PATH" -dmg=no
          codesign --force --deep --sign - "$APP_PATH"

      - name: Create DMG
        run: |
          APP_NAME="QueMusic"
          ARCH_NAME="${{ matrix.os == 'macos-14' && 'arm64' || 'x86_64' }}"
          DMG_NAME="${APP_NAME}-$(git describe --tags --always)-macOS-${ARCH_NAME}.dmg"
          echo "DMG_NAME=$DMG_NAME" >> "$GITHUB_ENV"
          hdiutil create -volname "${APP_NAME}" \
            -srcfolder "${APP_PATH}" \
            -ov -format UDZO "${DMG_NAME}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DMG_NAME }}
          path: ${{ env.DMG_NAME }}

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DMG_NAME }}
          generate_release_notes: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}