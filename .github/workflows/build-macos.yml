name: Build macOS

# 触发条件：
#   - 推送 v* 标签时（发布 Release 用）
#   - 手动触发（Actions 页面点 Run workflow）
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        # macos-14 = Apple Silicon (arm64), macos-13 = Intel (x86_64)
        # 想同时出两个架构就都保留；只想出 arm64 就删掉 macos-13 行
        os: [macos-14, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Qt 6.9.3 (aqtinstall)
        run: |
          python3 -m pip install --user aqtinstall
          python3 -m aqt install-qt mac desktop 6.9.3 clang_64 -O "$HOME/Qt"
          echo "$HOME/Qt/6.9.3/clang_64/bin" >> "$GITHUB_PATH"

      - name: Configure (CMake)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$HOME/Qt/6.9.3/clang_64"

      - name: Build
        run: |
          cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Bundle with macdeployqt
        run: |
          # 找出 .app bundle 路径
          APP_PATH=$(find build -maxdepth 2 -name "*.app" -type d | head -n1)
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          # 把 Qt 运行库打进 .app
          "$HOME/Qt/6.9.3/clang_64/bin/macdeployqt" "$APP_PATH" \
            -dmg=no
          # ad-hoc 签名（无开发者证书时也能在本机运行）
          codesign --force --deep --sign - "$APP_PATH"

      - name: Create DMG
        run: |
          APP_NAME="QueMusic"
          ARCH_NAME="${{ matrix.os == 'macos-14' && 'arm64' || 'x86_64' }}"
          DMG_NAME="${APP_NAME}-0.1.0-macOS-${ARCH_NAME}.dmg"
          echo "DMG_NAME=$DMG_NAME" >> "$GITHUB_ENV"
          hdiutil create -volname "${APP_NAME}" \
            -srcfolder "${APP_PATH}" \
            -ov -format UDZO "${DMG_NAME}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DMG_NAME }}
          path: ${{ env.DMG_NAME }}

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DMG_NAME }}
          generate_release_notes: true
