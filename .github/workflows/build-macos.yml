name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  # 给「一键发布」流程（release.yml）复用；证书相关的 Secret 由调用方 inherit 传入
  workflow_call:
    secrets:
      APPLE_SIGN_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_APP_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

jobs:
  build-macos:
    strategy:
      fail-fast: false
      # macos-13（Intel）已被 GitHub 下线：用它会一直排队拿不到 runner，
      # 约 24h 后被取消（见历史运行 20/21/23/24，runner_id 一直是 0）。
      # Intel 包改用当前的 x64 标签 macos-15-intel；macos-14 是 arm64。
      # 两个 runner 都按「原生架构」构建，DMG 名用 uname -m 区分（arm64 / x86_64）。
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write   # <--- 新增：赋予写入 Release 的权限
    env:
      # 配了 Developer ID 证书就走正式签名 + 公证；没配则退回 ad-hoc（用户首次打开需手动放行）
      APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Qt 6.10.3 (aqtinstall)
        run: |
          python3 -m pip install --break-system-packages aqtinstall
          python3 -m aqt install-qt mac desktop 6.10.3 clang_64 -m all -O "$HOME/Qt"

      - name: Locate Qt installation
        id: locate_qt
        run: |
          QT6_CFG=$(find "$HOME/Qt" -name "Qt6Config.cmake" 2>/dev/null | head -n1)
          if [ -z "$QT6_CFG" ]; then
            echo "!! FATAL: Qt6Config.cmake not found"
            find "$HOME/Qt" -type d -maxdepth 3 2>/dev/null || true
            exit 1
          fi
          QT_PREFIX="${QT6_CFG%/lib/cmake/Qt6/Qt6Config.cmake}"
          echo "QT_PREFIX=$QT_PREFIX" >> "$GITHUB_ENV"
          echo "Found Qt at: $QT_PREFIX"
          if [ ! -f "$QT_PREFIX/lib/cmake/Qt6Multimedia/Qt6MultimediaConfig.cmake" ]; then
            echo "!! ERROR: Qt6Multimedia not found at $QT_PREFIX/lib/cmake/Qt6Multimedia"
            echo "Available components in $QT_PREFIX/lib/cmake:"
            ls -la "$QT_PREFIX/lib/cmake" || true
            exit 1
          fi
          echo "Qt6Multimedia found at $QT_PREFIX/lib/cmake/Qt6Multimedia"

      # 音频后端的解码层直接链接 libavcodec/libavformat/libavutil/libswresample。
      # 官方 Qt 的 macOS 包自带这 4 个 dylib（FFmpeg 7.1.3），CMake 会直接用它 + 仓库里的
      # ffmpeg/include 头文件（同版本 61.x），所以通常什么都不用装。
      # 只有换成自制/精简 Qt 时才需要兜底装 brew 版 ffmpeg（并让 pkg-config 找得到）。
      - name: Ensure FFmpeg libraries
        run: |
          set -euo pipefail
          if [ -e "$QT_PREFIX/lib/libavcodec.dylib" ]; then
            echo "✅ 使用 Qt 自带 FFmpeg：$(ls -1 "$QT_PREFIX"/lib/libav*.dylib | xargs -n1 basename | tr '\n' ' ')"
            exit 0
          fi
          echo "⚠️  $QT_PREFIX/lib 里没有 libav*.dylib，退回 brew 版 ffmpeg"
          command -v pkg-config >/dev/null 2>&1 || brew install pkgconf
          brew list --formula ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          BP="$(brew --prefix)"
          echo "PKG_CONFIG_PATH=${BP}/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          export PKG_CONFIG_PATH="${BP}/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          for m in libavcodec libavformat libavutil libswresample; do
            printf '  %s: %s\n' "$m" "$(pkg-config --modversion "$m")"
          done

      - name: Generate .icns app icon
        run: |
          mkdir -p icon.iconset
          sips -z 16 16     resources/app/rainbowMusicIcon.png --out icon.iconset/icon_16x16.png
          sips -z 32 32     resources/app/rainbowMusicIcon.png --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     resources/app/rainbowMusicIcon.png --out icon.iconset/icon_32x32.png
          sips -z 64 64     resources/app/rainbowMusicIcon.png --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   resources/app/rainbowMusicIcon.png --out icon.iconset/icon_128x128.png
          sips -z 256 256   resources/app/rainbowMusicIcon.png --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   resources/app/rainbowMusicIcon.png --out icon.iconset/icon_256x256.png
          sips -z 512 512   resources/app/rainbowMusicIcon.png --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   resources/app/rainbowMusicIcon.png --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 resources/app/rainbowMusicIcon.png --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o resources/app/icon.icns

      - name: Configure (CMake)
        run: |
          # 明确按 runner 原生架构构建（macos-14=arm64，macos-15-intel=x86_64）。
          # Qt 官方 macOS 包是 universal（arm64+x86_64）二进制，构建出的 app 可执行文件
          # 也要和后面「裁剪成单架构」的 Qt 库保持一致。
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="$(uname -m)" \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX" \
            -DQT_DIR="$QT_PREFIX" \
            -DQt6_DIR="$QT_PREFIX/lib/cmake/Qt6" \
            -DQt6Multimedia_DIR="$QT_PREFIX/lib/cmake/Qt6Multimedia"

      - name: Build
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      # Qt 的 macOS 包里 sqlite 之外的 SQL 驱动（odbc / mimer / mysql / psql）会链接
      # /opt/homebrew/opt/libiodbc/... 和 /usr/local/lib/libmimerapi.dylib 这类「构建机路径」，
      # macdeployqt 会把它们原样拷进 bundle：在用户机器上既加载不了，又会让下面的依赖检查
      # 判定「引用了构建机路径」。本项目只用 QSQLITE，删掉最干净（与 Linux 流程同一策略）。
      - name: 只保留 sqlite 驱动（从 Qt 安装目录删）
        run: |
          set -euo pipefail
          SQ="$QT_PREFIX/plugins/sqldrivers"
          if [ ! -d "$SQ" ]; then
            echo "⚠️  $SQ 不存在，跳过"
            exit 0
          fi
          echo "删除前: $(ls -1 "$SQ" | tr '\n' ' ')"
          find "$SQ" -maxdepth 1 -name 'libqsql*' ! -name 'libqsqlite.*' -delete
          echo "删除后: $(ls -1 "$SQ" | tr '\n' ' ')"
          ls "$SQ"/libqsqlite.* >/dev/null 2>&1 \
            || { echo "::error::连 sqlite 驱动都不见了，检查 Qt 安装是否完整"; exit 1; }

      # -qmldir 只指向本工程自己的 QML。
      # 以前传的是仓库根 $PWD：qmlimportscanner 会递归扫遍整个仓库（含 build/、
      # ThirdParty/、tests/），于是 qwindowkit/examples/qml 的 Qt.labs.platform、
      # qmsetup 测试 QML 里的裸 QtQuick.Controls 之类「跟应用无关」的 import
      # 也会被当成依赖部署，把用不到的模块一起带进 bundle。
      # 注意：Controls 的几套样式在这一步省不掉（Basic 本身就是 QtQuick.Controls
      # 的一部分，macdeployqt 是整目录搬），要靠下面的裁剪步骤删。
      - name: 准备 QML 扫描目录（只含本工程 QML）
        run: |
          set -euo pipefail
          rm -rf .qmlscan
          mkdir -p .qmlscan
          cp -R main.qml SettingsView.qml components pages layout lyricsui .qmlscan/
          echo "扫描目录里的 QML 文件数: $(find .qmlscan -name '*.qml' | wc -l | tr -d ' ')"

      - name: Bundle with macdeployqt
        run: |
          set -euo pipefail
          APP_PATH="$(find build -maxdepth 2 -name "*.app" -type d | head -n1)"
          if [ -z "$APP_PATH" ]; then
            echo "!! 没找到 .app，构建产物不完整"
            find build -maxdepth 3 -type d | head -30
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "APP=$APP_PATH"

          # -qmldir 必须给：QML 都编进 qrc 了，bundle 里没有自己的 qml 目录，
          # 不告诉 macdeployqt 去哪扫 import，它就不会部署 QtQuick/Controls 等 QML 模块
          # —— 用户打开会直接报 module "QtQuick" is not installed。
          # （Qt 6.10 的 macdeployqt 把 QML 模块放在 Contents/Resources/qml/，
          #   其中的 .dylib 实体放 Contents/PlugIns/quick/ 再软链回去，qt.conf 里
          #   QmlImports = Resources/qml。）
          # 注意：macdeployqt 会顺手把非 Qt 的第三方 dylib（这里就是 Qt 自带的 libav*）
          # 一起拷进 Contents/Frameworks 并改写 install name，所以无需 brew 装 ffmpeg。
          "$QT_PREFIX/bin/macdeployqt" "$APP_PATH" -qmldir="$PWD/.qmlscan" -always-overwrite

      # macdeployqt 部署一个 QML 模块时是「整个模块目录一起搬」，所以只要用到
      # QtQuick/Controls，Material/Fusion/Imagine/Universal/FluentWinUI3 五套风格
      # 连同 designer 元数据都会被塞进 bundle（Linux 流程里实测 15~20MB 解压体积）。
      # 本项目 QML 全是显式 import QtQuick.Controls.Basic（doc/06-components.md 也是这个约定），
      # 这里只保留真正 import 的东西：
      #   QtQuick / QtQml(.Models) / QtQuick.Controls(.Basic) / QtQuick.Layouts /
      #   QtQuick.Dialogs / QtQuick.Shapes / QtQuick.Effects /
      #   Qt.labs.folderlistmodel / QtMultimedia（LyricsFree.qml 的 MediaPlayer 视频背景）
      # 与 Linux 流程同一策略：删掉用不到的东西，只留一份。
      - name: 裁剪未使用的 QML 模块与插件
        run: |
          set -euo pipefail
          QML_ROOT=""
          for d in "$APP_PATH/Contents/Resources/qml" "$APP_PATH/Contents/PlugIns/qml"; do
            if [ -d "$d" ]; then QML_ROOT="$d"; break; fi
          done
          echo "QML_ROOT=${QML_ROOT:-<无>}"

          prune() {
            if [ -e "$1" ]; then rm -rf "$1"; echo "✂️  $2"; fi
          }

          if [ -n "$QML_ROOT" ]; then
            # 除 Basic 以外的 Controls 样式（全项目只用 QtQuick.Controls.Basic）。
            # FluentWinUI3 是 Qt 6.10 新增的一套，体积最大（实测 6.4MB，多为图片资源）；
            # designer 只有 Qt Quick Designer 用得到，运行期用不到。
            for s in Material Fusion Imagine Universal FluentWinUI3 Windows macOS iOS designer; do
              prune "$QML_ROOT/QtQuick/Controls/$s" "样式 QtQuick/Controls/$s"
            done
            # 明确没用到的模块
            for m in QtQuick3D Qt3D QtCharts QtDataVisualization QtGraphs QtPdf \
                     QtWebEngineCore QtWebEngineQuick QtWebChannel QtWebView \
                     QtSensors QtPositioning QtBluetooth QtNfc QtSerialPort QtTest \
                     QtDesigner QtHelp QtRemoteObjects QtScxml QtStateMachine Qt5Compat; do
              prune "$QML_ROOT/$m" "模块 $m"
            done
            for m in QtQuick/Timeline QtQuick/Pdf QtQuick/VirtualKeyboard \
                     Qt/labs/Animation Qt/labs/SharedLayouts Qt/labs/Settings Qt/labs/Test; do
              prune "$QML_ROOT/$m" "模块 $m"
            done
            if [ ! -d "$QML_ROOT/QtQuick/Controls/Basic" ]; then
              echo "::warning::QtQuick/Controls/Basic 不见了，检查上面的裁剪清单"
            fi
          fi

          # 只服务 Qt Quick 3D / QML 调试器的插件
          for p in assetimporters sceneparsers renderers geometryloaders qmltooling designer; do
            prune "$APP_PATH/Contents/PlugIns/$p" "插件目录 $p"
          done

          if [ -n "$QML_ROOT" ]; then
            echo "--- 保留下来的 QML 模块 ---"
            ls -1 "$QML_ROOT"
          fi

      # 体积报告：先看清楚钱花在哪，再谈优化
      - name: 报告 bundle 体积
        run: |
          set -uo pipefail
          echo "=== 总量 ==="
          du -sh "$APP_PATH"
          for d in Contents/MacOS Contents/Frameworks Contents/PlugIns Contents/Resources; do
            if [ -d "$APP_PATH/$d" ]; then du -sh "$APP_PATH/$d"; fi
          done || true
          echo "=== QML 模块 TOP 15（MB） ==="
          QML_ROOT="$APP_PATH/Contents/Resources/qml"
          if [ -d "$QML_ROOT" ]; then
            du -sm "$QML_ROOT"/* 2>/dev/null | sort -rn | head -15 || true
          fi
          echo "=== 最大的 25 个文件（MB） ==="
          find "$APP_PATH" ! -type l -type f -size +2M -print0 2>/dev/null \
            | xargs -0 du -m 2>/dev/null | sort -rn | head -25 || true
          echo "=== 架构（universal 就是双份体积） ==="
          MAIN_EXE="$(find "$APP_PATH/Contents/MacOS" -maxdepth 1 -type f | head -n1)" || true
          lipo -archs "$MAIN_EXE" || true
          for fw in "$APP_PATH"/Contents/Frameworks/Qt6Core.framework/Qt6Core \
                    "$APP_PATH"/Contents/Frameworks/Qt6Quick.framework/Qt6Quick; do
            if [ -f "$fw" ]; then printf '%s: ' "$(basename "$fw")"; lipo -archs "$fw" || true; fi
          done

      # ★ 最有效的一步：Qt 官方 macOS 二进制是 universal（arm64 + x86_64），
      #   macdeployqt 会把整个 framework 原样拷进来，于是 bundle 里每个 Qt 库、
      #   每个 QML 插件、连 libavcodec 都是双架构 —— 体积天然是 Linux/Windows 的 2 倍。
      #   本流程本来就是「每个 runner 只产出一个架构的 DMG」，所以这里把包里所有
      #   Mach-O 裁成 runner 原生架构，丢掉用不到的那一半。
      #   注意必须在 codesign 之前做：lipo 会破坏已有签名。
      - name: 瘦身：把 universal 二进制裁成单架构
        run: |
          set -uo pipefail
          ARCH="$(uname -m)"
          BEFORE_KB="$(du -sk "$APP_PATH" | cut -f1)"
          THINNED=0
          SKIPPED=0

          thin_one() {
            local f="$1" archs n
            archs="$(lipo -archs "$f" 2>/dev/null)" || return 0
            n="$(echo "$archs" | wc -w | tr -d ' ')"
            if [ "$n" -le 1 ]; then SKIPPED=$((SKIPPED+1)); return 0; fi
            if ! echo "$archs" | tr ' ' '\n' | grep -qx "$ARCH"; then
              echo "⚠️  没有 $ARCH 切片，跳过: $f"
              return 0
            fi
            if lipo -thin "$ARCH" "$f" -output "$f.thin"; then
              mv -f "$f.thin" "$f"
              THINNED=$((THINNED+1))
            else
              rm -f "$f.thin"
              echo "⚠️  lipo 失败: $f"
            fi
            return 0
          }

          # 只处理真实文件（跳过 framework 里的版本软链），且只挑「可执行 / 动态库」
          while IFS= read -r -d '' f; do
            thin_one "$f"
          done < <(find "$APP_PATH" ! -type l -type f \
                     \( -name '*.dylib' -o -name '*.so' -o -perm -u+x \) -print0)

          AFTER_KB="$(du -sk "$APP_PATH" | cut -f1)"
          echo "裁剪目标架构: $ARCH"
          echo "瘦身文件数: $THINNED（已单架构跳过: $SKIPPED）"
          echo "bundle: $((BEFORE_KB/1024)) MB → $((AFTER_KB/1024)) MB"
          echo "复查：仍为多架构的文件（正常应为 0）"
          FAT_LEFT=0
          while IFS= read -r -d '' f; do
            a="$(lipo -archs "$f" 2>/dev/null)" || continue
            case "$a" in
              *" "*) FAT_LEFT=$((FAT_LEFT+1)); echo "   $f -> $a" ;;
            esac
          done < <(find "$APP_PATH" ! -type l -type f \
                     \( -name '*.dylib' -o -name '*.so' -o -perm -u+x \) -print0)
          echo "多架构残留: $FAT_LEFT"

      # 校验门禁：bundle 必须自带 FFmpeg 动态库（音频解码层直接链接），
      # 且不能残留构建机上的绝对路径，否则用户换台 Mac 打开就是「已损坏」或直接闪退。
      - name: Verify bundle（FFmpeg 动态库 + 依赖路径）
        run: |
          set -uo pipefail
          MISSING=0

          echo "--- Contents/Frameworks 里的 FFmpeg ---"
          ls -l "$APP_PATH/Contents/Frameworks" | grep -Ei 'libav|libsw' || true
          for m in libavcodec libavformat libavutil libswresample; do
            if ls "$APP_PATH"/Contents/Frameworks/${m}*.dylib >/dev/null 2>&1; then
              echo "✅ $m 已打进 bundle"
            else
              echo "❌ bundle 内缺少 $m：音频解码层直接链接它，用户侧启动即崩"
              MISSING=1
            fi
          done

          echo "--- 构建机绝对路径检查 ---"
          scan_host_refs() {
            local f
            for f in "$APP_PATH/Contents/MacOS/"*; do
              [ -f "$f" ] || continue
              otool -L "$f" 2>/dev/null | tail -n +2 |
                awk -v F="$(basename "$f")" '$1 ~ /^\/(opt\/homebrew|usr\/local|Users)\// {print F " -> " $1}'
            done
            find "$APP_PATH/Contents" \( -name '*.dylib' -o -name '*.so' \) 2>/dev/null |
              while IFS= read -r f; do
                otool -L "$f" 2>/dev/null | tail -n +2 |
                  awk -v F="$(basename "$f")" '$1 ~ /^\/(opt\/homebrew|usr\/local|Users)\// {print F " -> " $1}'
              done
          }
          HOST_REFS="$(scan_host_refs | sort -u)"
          if [ -n "$HOST_REFS" ]; then
            while IFS= read -r l; do [ -n "$l" ] && echo "❌ 仍指向构建机路径：$l"; done <<< "$HOST_REFS"
            echo "   （左边是引用它的文件；常见来源是 Qt 自带的 odbc/mimer/mysql 等 SQL 驱动插件，本流程只保留 sqlite）"
            MISSING=1
          else
            echo "✅ 没有指向构建机的绝对路径依赖"
          fi

          echo "--- QML 模块 ---"
          # macdeployqt 把 QML 模块放 Contents/Resources/qml/；旧版/其他包装方式可能是 PlugIns/qml/
          QML_ROOT=""
          for d in "$APP_PATH/Contents/Resources/qml" "$APP_PATH/Contents/PlugIns/qml"; do
            [ -d "$d" ] && QML_ROOT="$d" && break
          done
          if [ -n "$QML_ROOT" ]; then
            echo "✅ QML 模块目录: $QML_ROOT"
            ls -1 "$QML_ROOT" | head -20
          else
            echo "⚠️  bundle 里没有 QML 模块目录（启动会报 module \"QtQuick\" is not installed）：-qmldir 没扫到 import？"
          fi

          [ "$MISSING" -eq 0 ] || { echo "::error::bundle 校验未通过，终止打包"; exit 1; }
          echo "🎉 bundle 校验通过"

      # 冒烟测试：裁剪/瘦身最容易踩的坑是「少了一个 QML 模块或 dylib」，
      # 这类问题只在用户点开对应界面时才暴露。这里启动一次应用，只对
      # 「模块缺失 / dyld 加载失败」这类明确信号判失败，其它情况只记录日志。
      - name: 冒烟测试（只看模块缺失 / dyld 加载失败）
        run: |
          set -uo pipefail
          MAIN_EXE="$(find "$APP_PATH/Contents/MacOS" -maxdepth 1 -type f | head -n1)" || true
          if [ -z "$MAIN_EXE" ]; then
            echo "::error::找不到主可执行文件"; exit 1
          fi
          LOG="$(mktemp)"
          "$MAIN_EXE" >"$LOG" 2>&1 &
          PID=$!
          sleep 12
          if kill -0 "$PID" 2>/dev/null; then
            kill "$PID" 2>/dev/null || true
            sleep 2
            kill -9 "$PID" 2>/dev/null || true
          fi
          wait "$PID" 2>/dev/null || true

          echo "--- 启动日志（前 40 行）---"
          head -40 "$LOG" || true
          if grep -q 'qt.qpa.plugin' "$LOG"; then
            echo "⚠️  runner 上起不了 GUI（平台插件不可用），本次冒烟无结论，不作为失败依据"
          fi
          if grep -qE 'is not installed|Library not loaded|Symbol not found|dyld: ' "$LOG"; then
            echo "::error::冒烟测试发现缺失 QML 模块或动态库，见上面的日志"
            exit 1
          fi
          echo "✅ 启动日志里没有模块缺失 / dylib 加载错误"

      # 代码签名：由内向外逐层签，不用已废弃的 --deep。
      # Qt 应用有大量嵌套 framework/plugin，--deep 常留下无法验证的签名，
      # 而"签名验证不通过"正是 macOS 报"已损坏，无法打开"（而不是提示未受信任）的原因。
      - name: Code sign app
        run: |
          IDENTITY="${APPLE_SIGN_IDENTITY:--}"
          if [ "$IDENTITY" = "-" ]; then
            TS="--timestamp=none"
            OPTIONS=""
          else
            TS="--timestamp"
            # 公证要求 hardened runtime；Qt QML 需要 JIT 相关 entitlement
            OPTIONS="--options runtime --entitlements packaging/entitlements-macos.plist"
          fi
          echo "签名身份: $IDENTITY"

          sign_item() {
            codesign --force $TS $OPTIONS --sign "$IDENTITY" "$1" \
              || { echo "::group::codesign 详细输出: $1"
                   codesign --force $TS $OPTIONS --verbose=4 --sign "$IDENTITY" "$1" 2>&1 | tail -20 || true
                   echo "::endgroup::"
                   echo "!! 签名失败: $1"; exit 1; }
          }

          # 顺序：framework → 其它 dylib → 其余 Mach-O（主程序/辅助工具）→ .app 本体
          #
          # 1) framework 按「bundle」签，codesign 会连带处理它内部的版本目录与二进制
          while IFS= read -r -d '' fw; do sign_item "$fw"; done \
            < <(find "$APP_PATH" -depth -type d -name "*.framework" -print0)

          # 2) 其余 .dylib / .so；framework 内部的跳过（上一步已按 bundle 签过）
          #    必须扫整个 .app，不能只扫 Frameworks 和 PlugIns：落在其它子目录（如 Contents/MacOS/）
          #    的动态库漏签时，签 .app 本体会报
          #    "code object is not signed at all / In subcomponent: .../<漏签的库>"。
          while IFS= read -r -d '' lib; do
            case "$lib" in *".framework/"*) continue ;; esac
            sign_item "$lib"
          done < <(find "$APP_PATH" ! -type l -type f \( -name "*.dylib" -o -name "*.so" \) -print0)

          # 3) 其它可执行的 Mach-O：主可执行文件、可能存在的 helper
          #    （entitlements / hardened runtime 就落在主可执行文件上）
          while IFS= read -r -d '' exe; do
            case "$exe" in *".framework/"*) continue ;; esac
            if file -b "$exe" | grep -q 'Mach-O'; then sign_item "$exe"; fi
          done < <(find "$APP_PATH" ! -type l -type f -perm -u+x \
                     ! -name "*.dylib" ! -name "*.so" -print0)

          # 4) 最后签 .app 本体
          sign_item "$APP_PATH"

      # 校验门禁：签名必须能验证通过，否则用户会看到"已损坏"，这里直接让 CI 失败
      - name: Verify app signature
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          echo "--- 签名信息 ---"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1 | head -20 || true
          echo "--- Gatekeeper 评估（ad-hoc/未公证时被拒属预期）---"
          spctl -a -vvv -t exec "$APP_PATH" || true

      - name: Create DMG
        run: |
          APP_NAME="QueMusic"
          # 按构建机实际架构命名（arm64 / x86_64），避免文件名与实际不符导致用户下错包
          ARCH_NAME="$(uname -m)"
          DMG_NAME="${APP_NAME}-macOS-${ARCH_NAME}.dmg"
          echo "DMG_NAME=$DMG_NAME" >> "$GITHUB_ENV"
          # zlib-level=9：DMG 是最后一道压缩，默认级别偏快；拉满对发布包更划算
          #（想再小一点可以换 -format ULFO / LZFSE，但公证对 UDZO 最稳妥）
          hdiutil create -volname "${APP_NAME}" \
            -srcfolder "${APP_PATH}" \
            -ov -format UDZO -imagekey zlib-level=9 "${DMG_NAME}"

          echo "--- 体积 ---"
          du -sh "${APP_PATH}"
          ls -lh "${DMG_NAME}"
          {
            echo "### macOS ${ARCH_NAME} 打包体积"
            echo
            echo "| 项目 | 大小 |"
            echo "|---|---|"
            echo "| .app | $(du -sh "${APP_PATH}" | cut -f1) |"
            echo "| .dmg | $(du -sh "${DMG_NAME}" | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

      # 有 Developer ID 证书时：签 DMG + 提交公证 + 装订票据，用户打开不再有任何提示。
      # 需要仓库 Secrets：APPLE_SIGN_IDENTITY / APPLE_ID / APPLE_APP_PASSWORD / APPLE_TEAM_ID
      - name: Sign & notarize DMG
        if: env.APPLE_SIGN_IDENTITY != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign --force --timestamp --sign "$APPLE_SIGN_IDENTITY" "$DMG_NAME"
          xcrun notarytool submit "$DMG_NAME" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG_NAME"
          xcrun stapler validate "$DMG_NAME"
          spctl -a -t open --context context:primary-signature -v "$DMG_NAME"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DMG_NAME }}
          path: ${{ env.DMG_NAME }}

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DMG_NAME }}
          generate_release_notes: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}