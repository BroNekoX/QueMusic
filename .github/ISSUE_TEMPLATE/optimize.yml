name: "优化建议"
description: "对已有功能的小幅度优化或改进建议"
labels: [功能, 新提交]
body:
- type: checkboxes
  id: "check"
  attributes:
    label: "检查项"
    description: "请逐个检查下列项目，并勾选确认。"
    options:
    - label: "我已在 [Issues 页面](https://github.com/BroNekoX/QueMusic/issues?q=is%3Aissue+) 中搜索，确认这一建议未被提交过。"
      required: true
- type: textarea
  id: "desc"
  attributes:
    label: 描述
    description: "详细描述具体需要优化哪些地方，要改成怎样的。"
  validations:
    required: true
- type: textarea
  id: "reason"
  attributes:
    label: 原因
    description: "详细描述你为什么需要这项优化，这有助于开发者评估它的优先度。"
    value: |
      （示例）
      这项优化让我可以更方便地xxxx。
      如果没有这项优化，我每次都必须xxxx，让操作变得很麻烦。
  validations:
    required: true