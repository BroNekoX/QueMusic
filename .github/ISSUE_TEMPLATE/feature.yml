name: "新功能提案"
description: "对已有功能的大幅度修改，或添加一个新内容或选项"
labels: [功能, 新提交]
body:
- type: checkboxes
  id: "check"
  attributes:
    label: "检查项"
    description: "请逐个检查下列项目，并勾选确认。"
    options:
    - label: "我已在 [Issues 页面](https://github.com/BroNekoX/QueMusic/issues?q=is%3Aissue+) 中搜索，确认这一提案未被提交过。"
      required: true
    - label: "我了解开发团队会优先处理 Bug 与优化，新功能提案的处理周期可能较长。"
      required: true
- type: textarea
  id: "desc"
  attributes:
    label: 描述
    description: "详细描述你想添加的功能具体是怎样的。"
  validations:
    required: true
- type: textarea
  id: "reason"
  attributes:
    label: 原因
    description: "详细描述你为什么需要这项功能，这有助于开发者评估它的优先度。"
    value: |
      （示例）
      我需要这个功能来xxxx。很多人都有xxxx的需求，但如果没有这个功能，就不能xxxx了。
  validations:
    required: true